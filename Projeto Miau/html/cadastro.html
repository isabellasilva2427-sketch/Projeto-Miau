<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Projeto Miau</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>Projeto Miau</h1>

        <nav class="navbar">

            <input type="checkbox" id="menu-toggle">

            <label for="menu-toggle" class="menu-icon">☰</label>

            <ul class="menu">

                <li>
                    <a href="index.html">Início</a>
                </li>

                <li class="dropdown">
                    <a href="projetos.html">Projetos ▾</a>

                    <ul class="submenu">
                        <li>
                            <a href="projetos.html#doacao">Doação</a>
                        </li>

                        <li>
                            <a href="projetos.html#voluntariado">Voluntariado</a>
                        </li>

                        <li>
                            <a href="projetos.html#acolhimento">Acolhimento</a>
                        </li>
                    </ul>
                </li>

                <li>
                    <a href="cadastro.html">Cadastro</a>
                </li>

            </ul>

        </nav>
    </header>

    <main>

        <section class="intro">

            <h2>Cadastro de Voluntários</h2>

            <p>
                Preencha o formulário abaixo para demonstrar seu interesse
                em colaborar com o Projeto Miau.
            </p>

        </section>

        <form>

            <fieldset>

                <legend>Dados pessoais</legend>

                <label for="nome">Nome completo:</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                >

                <br><br>

                <label for="email">E-mail:</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <br><br>

                <label for="nascimento">Data de nascimento:</label>

                <input
                    type="date"
                    id="nascimento"
                    name="nascimento"
                    required
                >

                <br><br>

                <label for="cpf">CPF:</label>

                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    pattern="[0-9]{3}\.?[0-9]{3}\.?[0-9]{3}-?[0-9]{2}"
                    placeholder="000.000.000-00"
                    required
                >

                <br><br>

                <label for="telefone">Telefone:</label>

                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    pattern="\(?[0-9]{2}\)?\s?[0-9]{4,5}-?[0-9]{4}"
                    placeholder="(11) 99999-9999"
                    required
                >

            </fieldset>

            <fieldset>

                <legend>Endereço</legend>

                <label for="cep">CEP:</label>

                <input
                    type="text"
                    id="cep"
                    name="cep"
                    pattern="[0-9]{5}-?[0-9]{3}"
                    placeholder="00000-000"
                    required
                >

                <br><br>

                <label for="endereco">Endereço:</label>

                <input
                    type="text"
                    id="endereco"
                    name="endereco"
                    required
                >

                <br><br>

                <label for="cidade">Cidade:</label>

                <input
                    type="text"
                    id="cidade"
                    name="cidade"
                    required
                >

                <br><br>

                <label for="estado">Estado:</label>

                <input
                    type="text"
                    id="estado"
                    name="estado"
                    required
                >

            </fieldset>

            <button type="submit">
                Enviar cadastro
            </button>

        </form>

    </main>

</body>

</html>
